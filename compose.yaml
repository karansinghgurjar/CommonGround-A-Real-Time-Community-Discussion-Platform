name: commonground
services:
  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      TRUST_PROXY: 1
      CLIENT_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - community_data:/app/data
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ./frontend
    init: true
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  community_data:
  caddy_data:
  caddy_config:
